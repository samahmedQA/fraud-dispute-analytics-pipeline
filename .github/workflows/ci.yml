name: CI Pipeline Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install hash-locked dependencies
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements-dev.lock.txt

      - name: Display environment
        run: |
          python --version
          python -m pip --version

      - name: Compile Python files
        run: |
          python -m compileall -q scripts dashboards
          python -m py_compile airflow/dags/fraud_dispute_pipeline_dag.py

      - name: Run full test suite
        run: |
          python -m pytest tests -q

      - name: Generate synthetic data
        run: |
          python scripts/generate_data.py

      - name: Create pipeline run ID
        shell: bash
        run: |
          RUN_ID="$(date -u +'%Y%m%dT%H%M%SZ')_$(python -c 'import uuid; print(uuid.uuid4().hex[:8])')"
          echo "PIPELINE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Pipeline Run ID: $RUN_ID"

      - name: Validate data contracts
        run: |
          python scripts/validate_data_contracts.py \
            --run-id "$PIPELINE_RUN_ID"

      - name: Partition validated data
        run: |
          python scripts/partition_data_for_s3.py \
            --run-id "$PIPELINE_RUN_ID"

  docker-checks:
    name: Docker checks
    runs-on: ubuntu-latest
    needs: python-checks
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build test image
        run: |
          docker build \
            --target test \
            --tag fraud-dispute-pipeline:test \
            .

      - name: Run containerized tests
        run: |
          docker run --rm fraud-dispute-pipeline:test

      - name: Build runtime image
        run: |
          docker build \
            --target runtime \
            --tag fraud-dispute-pipeline:ci \
            .

      - name: Verify runtime CLI
        run: |
          docker run --rm \
            fraud-dispute-pipeline:ci \
            --help

      - name: Verify non-root runtime
        run: |
          docker run --rm \
            --entrypoint sh \
            fraud-dispute-pipeline:ci \
            -lc '
              test "$(id -u)" = "10001"
              test -w /app
              echo "Runtime identity: $(id)"
              python --version
              echo "/app is writable"
            '
